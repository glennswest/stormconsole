[package]
name = "hubble"
description = "A client for Hubble relay's gRPC API: the only gRPC in the console, because Hubble has no other (#4)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
prost = "0.13"
prost-types = "0.13"
tonic = { version = "0.13", default-features = false, features = ["channel", "codegen", "prost", "server", "router"] }
futures-util.workspace = true

[build-dependencies]
protox = "0.8"
tonic-build = { version = "0.13", default-features = false, features = ["prost"] }

[dev-dependencies]
tokio.workspace = true
tokio-stream = "0.1"
