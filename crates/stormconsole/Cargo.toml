[package]
name = "stormconsole"
description = "The StormCOS console — pluggable, on stormd and stormview"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
console-core.workspace = true
plugin-kubernetes.workspace = true
plugin-fleet.workspace = true
plugin-logs.workspace = true
plugin-stormdrive.workspace = true
plugin-stormstorage.workspace = true
plugin-stormblock.workspace = true
plugin-sbregistry.workspace = true
plugin-vmimages.workspace = true
plugin-vm.workspace = true
plugin-fastetcd.workspace = true
plugin-stormipmi.workspace = true
plugin-stormcluster.workspace = true
plugin-flowsdn.workspace = true
plugin-apihealth.workspace = true

# Password hashing. argon2 rather than a digest: a password store is the
# one place where being *slow* is the feature, and SHA-256 is fast enough
# that a leaked config is a list of passwords by the afternoon. `subtle`
# for the token comparison, which was `==` and therefore timing-visible.
argon2 = { version = "0.5", features = ["std"] }
subtle = "2"
# :9094 over TLS with client certificates (#48, #127): the versions reqwest
# already brings, on the same ring provider, so nothing new is compiled in.
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }

stormview.workspace = true
tokio.workspace = true
tokio-util.workspace = true
axum.workspace = true
serde.workspace = true
