# stormconsole example configuration — /etc/stormconsole/config.toml
# Every section is optional; a missing file runs on these defaults.
#
# The flat node-service shape is accepted too — the two lines below are the
# whole of what a StormCOS golden writes, the same as stormdrive and
# stormstorage take. `listen_addr` is `[api] bind` and wins over it;
# `data_dir` is where the console writes (the log ring lives at
# <data_dir>/logs.db unless `[logs] db_path` says otherwise).
#
# listen_addr = "0.0.0.0:9094"
# data_dir    = "/var/lib/stormconsole"
#
# A config the console cannot run on is reported as one line on stderr
# ("stormconsole: fatal: config <path>: line N: …") and exit status 78
# (EX_CONFIG); a port it cannot bind exits 1. Unknown keys are errors.

[general]
name = "stormconsole"
# theme = "storm"                    # default UI theme; a viewer's pick wins

[api]
bind = "0.0.0.0:9094"
# auth_token = "s3cret"              # machine credential (Bearer); also admin login
# [[api.users]]                      # any user or token being set turns auth on
# name = "admin"
# password = "changeme"

[kubernetes]
enabled = true
# server = "https://192.168.8.150:6443"   # rustkube apiserver
# token = ""                              # ServiceAccount bearer token
# insecure_skip_tls_verify = true

[fleet]
enabled = true
mcast_group = "239.255.42.1:5514"    # stormcast group — nodes announce by existing

[logs]
enabled = true
mcast_group = "239.255.42.1:5514"
# db_path = "/var/lib/stormconsole/logs.db"   # default: <data_dir>/logs.db

[stormdrive]
enabled = true                       # endpoints come from fleet discovery

[stormblock]
enabled = true
# url = "http://192.168.8.150:9090"

[sbregistry]
enabled = true
# url = "http://192.168.8.150:8080"
