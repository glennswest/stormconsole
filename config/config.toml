# stormconsole example configuration — /etc/stormconsole/config.toml
# Every section is optional; a missing file runs on these defaults.
#
# The flat node-service shape is accepted too — the two lines below are the
# whole of what a StormCOS golden writes, the same as stormdrive and
# stormstorage take. `listen_addr` is `[api] bind` and wins over it;
# `data_dir` is where the console writes (the log ring lives at
# <data_dir>/logs.redb unless `[logs] db_path` says otherwise).
#
# listen_addr = "0.0.0.0:9094"
# data_dir    = "/var/lib/stormconsole"
#
# A config the console cannot run on is reported as one line on stderr
# ("stormconsole: fatal: config <path>: line N: …") and exit status 78
# (EX_CONFIG); a port it cannot bind exits 1. Unknown keys are errors.

[general]
name = "stormconsole"
# theme = "storm"                    # default UI theme; a viewer's pick wins

[api]
bind = "0.0.0.0:9094"
# auth_token = "s3cret"              # machine credential (Bearer); signing in
#                                    # with it (any name) is an admin session
# auth_token_file = "/etc/stormcert/stormconsole-api.token"
#                                    # the same, from a per-node file, re-read when
#                                    # it changes; missing = closed, not open
# install_token_file = "/state/config/token-auth.csv"
#                                    # the install-time API token (storminstall's
#                                    # apiToken, written by stormpump as the
#                                    # apiserver's token-auth file): signing in with
#                                    # it is an admin acting upstream as that token
# tls_cert_file = "/data/stormcert/stormconsole.crt"   # :9094 over TLS (a stormcert
# tls_key_file = "/data/stormcert/stormconsole.key"    # serving pair, re-read when
#                                    # renewed); plain HTTP then answers health only
# client_ca_file = "/run/stormblock/forge/ca.crt"     # forge's CA: its client
#                                    # certificates are credentials (needs TLS)
# client_crl_file = "/run/stormblock/forge/ca.crl"    # its revocation list, if any
# [[api.client_roles]]               # a verified certificate's role, by subject
# cn = "stormcentral"                # cn, or o = "…" (exactly one)
# role = "viewer"                    # viewer | operator | admin
# [[api.users]]                      # any user or token being set turns auth on
# name = "admin"
# password_hash = "$argon2id$v=19$…" # printf %s 'pw' | stormconsole --hash-password
# roles = ["admin"]                  # viewer (the default) | operator | admin
# ssh_keys = ["ssh-ed25519 AAAA… you@host"]   # offered on every VM you create
#
# A user may carry their own kubernetes identity. With one, what they see
# of the cluster is what the apiserver says they may see — asked as them,
# with their bearer — and every write they make carries it too, so RBAC
# decides. Without one there is no identity to authorize against and the
# console says so (/api/v1/console/access reports identified: false)
# rather than implying a check it is not doing.
# kube_token = "eyJhbGciOi…"          # a ServiceAccount token, or any bearer rustkube knows

# Every upstream below defaults to this node's own daemon on loopback (the
# golden runs on the host network), so a node needs none of these.

[kubernetes]
enabled = true
# server = "https://192.168.8.150:6443"   # default https://127.0.0.1:6443 (unverified TLS)
# token = ""                              # ServiceAccount bearer token, inline
# token_file = "/etc/stormcert/stormconsole.token"  # or from a file, re-read when stormcert renews it
# ca_file = "/etc/stormcert/ca.crt"       # check the apiserver against this CA only
# insecure_skip_tls_verify = true         # a configured server is verified unless set; not with ca_file
# Projects (namespaces) that hold the system's own things: marked system on
# the Projects page and never a create target. default, openshift, kube-*,
# openshift-*, storm-*, cilium and cilium-secrets always are; a trailing *
# matches a prefix.
# system_namespaces = ["perf-*"]

[fleet]
enabled = true
mcast_group = "239.255.42.1:5514"    # stormcast group — nodes announce by existing
# stormd_host = "127.0.0.1"          # where this node's stormd instances are probed
# stormd_ports = [9081, 9082, 9083, 9084, 9085, 9192, 9193, 9194]   # default: 9080–9089, 9180–9199, 9201, 9202, 180, 8180, 8269, 8545

[logs]
enabled = true
mcast_group = "239.255.42.1:5514"
# db_path = "/var/lib/stormconsole/logs.redb"  # default: <data_dir>/logs.redb
#
# The ring deduplicates on arrival: repeats of the same host/app/severity/
# message collapse into one entry with a count, so a service emitting the
# same line thousands of times a second costs one entry, not a million.
# dedup = true
#
# Two bounds, whichever bites first. Both are swept on a timer as well as
# on insert, so a fleet that goes quiet still expires what it left behind.
# ring_cap = 200000       # most distinct entries kept; oldest go first
# retain_hours = 168      # drop an entry this long after it was last seen
#                         # (0 disables the age bound)
# A third, in bytes: the ring keeps this much of its filesystem free. Under
# it the oldest entries go and the file is compacted; an I/O error reopens
# the ring rather than leaving it refusing everything.
# keep_free_percent = 20

[stormdrive]
enabled = true
# url = "http://127.0.0.1:9092"      # its stormview feed

# Drives are read fleet-wide: this node's stormdrive, and every host the
# fleet has heard from at its address on :9092. Name others here.
# [stormdrive.nodes]
# storm-7 = "http://192.168.8.117:9092"
[stormstorage]
enabled = true
# url = "http://127.0.0.1:9093"      # its stormview feed
# token_file = "/etc/stormconsole/stormstorage.token"   # its [api] api_token, for the feed's actions

[stormblock]
enabled = true
# url = "http://127.0.0.1:9090"

# The engine's API token, when it guards its API (v18 does, reads too):
# its <data_dir>/api_token. Without it every read is a 401.
# token_file = "/data/stormblock/api_token"
# An https:// url is verified against this CA and no other; there is no way to skip the check. On a node,
# once the engine serves TLS: url = "https://127.0.0.1:9090" and the node CA. A plain http:// url keeps
# working until the engine's tls_mode is required, and a CA with one is a config error.
# ca_file = "/data/stormcert/ca.crt"
# A client pair the node CA issued, which the engine takes at the node token's tier. Optional.
# cert_file = "/data/stormcert/stormconsole-client.crt"
# key_file = "/data/stormcert/stormconsole-client.key"
[sbregistry]
enabled = true
# url = "http://127.0.0.1:5100"
# A registry with an auth file answers reads 401 without a credential. A robot account's token,
# `*=pull` for the views and `*=admin` too for the create forms; followed when it changes. Unset: the
# engine's token ([stormblock] token_file), for a registry on this machine. Over HTTPS when
# [node_tls] is set; never sent plainly to another machine.
# token_file = "/run/stormblock/registry/token"

[vm]
enabled = true
# A VM is a KubeVirt object in the apiserver, not a thing this URL serves
# — the kubelet reconciles it (stormvm docs/kube.md), so the VM list needs
# no stormvm at all. This is only the two console doors, serial and
# framebuffer, which stormvm proxies. Unset or unreachable means the VM
# page says which upstream is missing rather than showing a terminal that
# will never print.
# url = "http://127.0.0.1:9095"
# Where each user's SSH keys are kept, as a Secret `<user>-ssh-keys`
# (Account → SSH keys). A machine gets a copy in its own namespace, because
# accessCredentials can only name a Secret there.
# ssh_keys_namespace = "default"

[vmimages]
enabled = true
# vmcloud-image-operator: the cloud-image catalogue, the VM goldens made
# from it, and each node's local copies. Also the VM create form's
# root-disk list.
# url = "http://127.0.0.1:9099"           # https:// by default when ca_file is set
# :9099 is TLS with a credential since vmcloud-image-operator#16: the node CA
# and the console's client pair, which the operator authorises as User
# stormconsole (stormcos 89-vmimages-console.yaml). Re-read when renewed.
# ca_file = "/data/stormcert/ca.crt"
# cert_file = "/data/stormcert/stormconsole-client.crt"
# key_file = "/data/stormcert/stormconsole-client.key"
# url = "http://127.0.0.1:9099"

[fastetcd]
enabled = true
# The cluster's datastore. /health and etcd's v3 JSON gateway on the
# client port — the gateway carries members, leader, raft, alarms, the
# keyspace and compact/defrag/disarm/snapshot; fastetcd serves it since
# v1.8.0 (fastetcd#28), and the card says so for an older one. /metrics is on
# its own listener, loopback by default.
# url = "http://127.0.0.1:2379"
# metrics_url = "http://127.0.0.1:2381"
# Mutual TLS on the client port, as stormcos runs it: fastetcd verified
# against the node CA only, the console presenting its own pair. Reread
# when the files change (stormcert renews them in place).
# url = "https://127.0.0.1:2379"
# ca_file = "/data/stormcert/ca.crt"
# cert_file = "/data/stormcert/stormconsole-etcd.crt"
# key_file = "/data/stormcert/stormconsole-etcd.key"

[stormipmi]
enabled = true
# The Machines page: bare metal by service tag — BMC, power, the SOL
# console, the release each machine boots and the default image — from
# stormipmi's Machines API. stormipmi runs on one node (a bastion), so point
# this at it. Reads are open; power, releases, test marks and adopting are
# admin-only here, and carry stormipmi's api.tokenFile bearer when it has one.
# url = "http://127.0.0.1:9097"
# token_file = "/etc/stormconsole/stormipmi.token"

# [node_tls]
# Each stormd and stormdrive over TLS, as a node moves to it (#49). Setting ca_file asks every port
# over HTTPS first. A certificate it does not trust is said, and that port is not read.
# ca_file = "/data/stormcert/ca.crt"
# cert_file = "/data/stormcert/stormconsole-client.crt"
# key_file = "/data/stormcert/stormconsole-client.key"
# require = false                          # true: no port is read plainly

[stormcluster]
enabled = true
# The Cluster page: members, discovered peers and operations, from the
# stormcluster that runs on every node (any node's answers for the whole
# cluster). Changes are cluster.storm.io objects written through the
# apiserver as the viewer ([kubernetes]), previewed with stormcluster's
# dry run first.
# url = "http://127.0.0.1:9102"           # https:// by default when ca_file is set
# token_file = "/etc/stormconsole/stormcluster.token"
# :9102 is TLS only since stormcluster#5: the node CA and the console's
# client pair (stormcert-agent client --name stormconsole-client --cn stormconsole),
# re-read when stormcert renews them.
# ca_file = "/data/stormcert/ca.crt"
# cert_file = "/data/stormcert/stormconsole-client.crt"
# key_file = "/data/stormcert/stormconsole-client.key"

[flowsdn]
enabled = true
# This node's pod network on the flowsdn edition: endpoints, IPAM, the
# agent's health and modules, its config, Services and node routes, from
# the agent's read-only listener (`http-listen`, loopback only). A node
# whose release manifest names the cilium edition shows "not this edition"
# and no page.
# url = "http://127.0.0.1:9878"
# release_manifest = "/etc/stormcos/release/manifest.json"

[health]
enabled = true
# This node's API health (stormcos#458): every declared API's state
# (healthy, slow, stalled, down) and latency, from PID 1's summary, with an
# alert on every page for one stalled or down. When the summary cannot be
# read, each stormd on the fleet ports is asked for /api/v1/health/apis
# instead (that misses PID 1's own probes). The history is the kept changes.
# summary_file = "/run/stormpump/health.json"
# history_dir = "/system-data/history/api"

[ironprom]
enabled = true
# The Metrics page: the node's scraper, every target with its last error and charts per level.
# url = "http://127.0.0.1:9091"

[stormupdate]
enabled = true
# The Update page: what this cluster runs, an update's steps, history, and an admin's
# start, pause, resume and rollback. Reads are open. Writes need stormupdate's update
# token, held here and added on the server; without it the page says they are not set up.
# url = "http://127.0.0.1:9088"
# token_file = "/etc/stormupdate/install/update-token"

[history]
enabled = true
# The node's record of itself, kept across installs (stormcos#456): installs,
# boots, kernel logs, drive history and hardware, served read-only at
# /api/v1/history and on the History page. A diskless boot has none, and says so.
# system_data = "/run/stormblock/system-data"

# [stormcentral]
# Where a stormpump:// image's golden is recorded: the pod page shows its
# build (built at, by, commit, build id) beside the image. Off unless a url
# is set; stormcentral's golden list needs a bearer it accepts.
# url = "http://stormcentral.g8.lo"
# token_file = "/etc/stormconsole/stormcentral.token"
